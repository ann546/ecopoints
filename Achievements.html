<script>
  let mysqlHistory = [];   // { type, points, description, date }
  let mysqlBalance = 0;
  let mysqlRank = 999;

  function totalKgFromHistory(history) {
    let total = 0;
    history.forEach((h) => {
      const match = String(h.description || "").match(/\(([\d.]+)\s*kg\)/i);
      if (match) total += parseFloat(match[1]);
    });
    return total;
  }

  function longestConsecutiveWeeks(history) {
    const weekKeys = new Set();
    history
      .filter((h) => h.type === "scan")
      .forEach((h) => {
        const d = new Date(h.date);
        if (Number.isNaN(d.getTime())) return;
        const firstJan = new Date(d.getFullYear(), 0, 1);
        const week = Math.ceil(
          ((d - firstJan) / 86400000 + firstJan.getDay() + 1) / 7
        );
        weekKeys.add(d.getFullYear() * 100 + week);
      });
    const sorted = [...weekKeys].sort((a, b) => a - b);
    let longest = sorted.length ? 1 : 0;
    let current = 1;
    for (let i = 1; i < sorted.length; i++) {
      current = sorted[i] - sorted[i - 1] === 1 ? current + 1 : 1;
      longest = Math.max(longest, current);
    }
    return longest;
  }

  function buildAchievements() {
    const history = mysqlHistory;
    const scanCount = history.filter((h) => h.type === "scan").length;
    const totalKg = totalKgFromHistory(history);
    const totalEarned = history
      .filter((h) => Number(h.points) > 0)
      .reduce((s, h) => s + Number(h.points), 0);
    const hasRedemption = history.some((h) => h.type === "redeem");
    const streak = longestConsecutiveWeeks(history);
    const rank = mysqlRank;

    return [
      { id: "first_submission", icon: "fa-seedling", label: "Reward Hunter", unlocked: scanCount >= 1, points: 50 },
      { id: "ten_submissions", icon: "fa-recycle", label: "10 Submissions", unlocked: scanCount >= 10, points: 150 },
      { id: "streak_4week", icon: "fa-fire", label: "4-Week Streak", unlocked: streak >= 4, points: 150 },
      { id: "kg_50", icon: "fa-weight-hanging", label: "50 kg Recycled", unlocked: totalKg >= 50, points: 200 },
      { id: "scan_20", icon: "fa-qrcode", label: "QR Verified 20x", unlocked: scanCount >= 20, points: 250 },
      { id: "first_redemption", icon: "fa-gift", label: "First Redemption", unlocked: hasRedemption, points: 50 },
      { id: "top5_rank", icon: "fa-medal", label: "Top 5 Rank", unlocked: rank <= 5, points: 400 },
      { id: "points_5000", icon: "fa-hundred-points", label: "5,000 Points", unlocked: totalEarned >= 5000, points: 500 },
      { id: "kg_100", icon: "fa-weight-scale", label: "100 kg Recycled", unlocked: totalKg >= 100, points: 400 },
      { id: "streak_8week", icon: "fa-calendar-check", label: "8-Week Streak", unlocked: streak >= 8, points: 350 },
      { id: "community_helper", icon: "fa-users", label: "Community Helper", unlocked: false, points: 300 },
      { id: "member_1year", icon: "fa-cake-candles", label: "1-Year Member", unlocked: false, points: 500 },
    ];
  }

  function awardNewAchievements(achievements) {
    if (typeof window.awardAchievement !== "function") return [];
    const newly = [];
    achievements.forEach((a) => {
      if (!a.unlocked) return;
      const wasNew = window.awardAchievement(a.id, a.label, a.points);
      if (wasNew) newly.push(a);
    });
    return newly;
  }

  function showAchievementToast(achievement) {
    let container = document.getElementById("achievementToastContainer");
    if (!container) {
      container = document.createElement("div");
      container.id = "achievementToastContainer";
      container.style.cssText =
        "position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none;";
      document.body.appendChild(container);
    }
    const toast = document.createElement("div");
    toast.style.cssText =
      "pointer-events:auto;background:#fff;border-left:5px solid var(--primary-green,#769826);box-shadow:0 14px 34px rgba(46,63,22,0.16);border-radius:10px;padding:14px 18px;display:flex;align-items:flex-start;gap:12px;min-width:280px;max-width:360px;font-family:'Manrope',sans-serif;";
    toast.innerHTML = `
      <i class="fa-solid ${achievement.icon}" style="color:var(--primary-green,#769826);font-size:1.4rem;margin-top:2px;"></i>
      <span style="display:flex;flex-direction:column;gap:2px;">
        <span style="font-weight:800;font-size:.9rem;color:#20291A;">Achievement Unlocked: ${achievement.label}</span>
        <span style="font-weight:500;font-size:.8rem;color:#5B6553;">+${achievement.points.toLocaleString()} EcoPoints</span>
      </span>
    `;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 5700);
  }

  function renderAchievements() {
    const achievements = buildAchievements();
    const grid = document.getElementById("achievementGrid");
    const tag = document.getElementById("achievementTag");

    grid.innerHTML = achievements
      .map(
        (a) => `
      <div class="achievement ${a.unlocked ? "unlocked" : ""}">
        <i class="fa-solid ${a.icon}"></i>
        <span>${a.label}</span>
      </div>
    `
      )
      .join("");

    const unlockedCount = achievements.filter((a) => a.unlocked).length;
    tag.textContent = `${unlockedCount} of ${achievements.length} unlocked`;

    const newlyAwarded = awardNewAchievements(achievements);
    newlyAwarded.forEach((a, i) => {
      setTimeout(() => showAchievementToast(a), i * 350);
    });
  }

  async function loadAchievementsFromMysql() {
    try {
      let session = null;
try {
  session = JSON.parse(EcoSession() || "null");
} catch (e) {}
if (!session) {
  try {
    session = JSON.parse(sessionStorage.getItem("ecoUser") || "null");
  } catch (e) {}
}
// Or, if auth-common is loaded: session = typeof getSession === "function" ? getSession() : session;

      const res = await fetch(
        `/api/residents/${encodeURIComponent(session.residentId)}/ecopoints`
      );
      const data = await res.json();

      if (!res.ok || !data.success) {
        console.error(data.error || "Failed to load ecopoints");
        renderAchievements();
        return;
      }

      mysqlBalance = Number(data.balance) || 0;

      // Map MySQL history â†’ shape achievements expect
      mysqlHistory = (data.history || []).map((h) => ({
        type: String(h.entry_type || "").toLowerCase() === "scan" ? "scan" : "earn",
        points: Number(h.points) || 0,
        description: h.description || "",
        date: h.created_at,
      }));

      // Redemptions â†’ redeem entries
      (data.redemptions || []).forEach((r) => {
        mysqlHistory.push({
          type: "redeem",
          points: -Number(r.points_cost) || 0,
          description: r.reward_name || "Redemption",
          date: r.redeemed_at,
        });
      });

      // Rank from leaderboard API (optional)
      try {
        const lb = await fetch("/api/leaderboard");
        const lbData = await lb.json();
        if (lb.ok && lbData.success) {
          const me = (lbData.leaderboard || []).find(
            (e) => Number(e.residentId) === Number(session.residentId)
          );
          mysqlRank = me ? me.rank : 999;
        }
      } catch {
        mysqlRank = 999;
      }

      renderAchievements();
    } catch (err) {
      console.error(err);
      renderAchievements();
    }
  }

  document.addEventListener("DOMContentLoaded", loadAchievementsFromMysql);
</script>
