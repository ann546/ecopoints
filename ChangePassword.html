<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoPoints | Change Password</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="Main Page.css?v=muhcihad9">
<link rel="stylesheet" href="ChangePassword.css?v=muhcihad9">
</head>
<body>

<header>
  <div class="nav-wrap">
    <a href="Main Page.html" class="logo">
      <span class="logo-badge"><i class="fa-solid fa-recycle"></i></span>
      EcoPoints
    </a>
    <div class="header-actions">
      <a href="Main Page.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
      <button type="button" class="link-muted" id="logoutBtn">Log Out</button>
    </div>
  </div>
</header>

<main class="auth-wrap">
  <div class="auth-shell single">

    <section class="auth-panel">
      <span class="eyebrow eyebrow-muted"><i class="fa-solid fa-user-shield"></i> Account Security</span>
      <form id="changeForm" class="auth-form active" novalidate>
        <h2>Change your password</h2>
        <p class="form-sub">Signed in as <span id="changeUserLabel"></span></p>

        <div class="field">
          <label for="currentPassword">Current password</label>
          <div class="password-wrap">
            <input type="password" id="currentPassword" placeholder="Enter your current password" autocomplete="current-password">
            <button type="button" class="toggle-pw" data-target="currentPassword" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
          </div>
          <span class="field-error" id="currentPasswordError"></span>
        </div>

        <div class="field">
          <label for="newPassword">New password</label>
          <div class="password-wrap">
            <input type="password" id="newPassword" placeholder="Create a new password" autocomplete="new-password">
            <button type="button" class="toggle-pw" data-target="newPassword" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
          </div>
          <div class="strength-meter" aria-hidden="true"><span id="strengthBar"></span></div>
          <span class="strength-label" id="strengthLabel">Use 8+ characters with a number and a symbol</span>
          <span class="field-error" id="newPasswordError"></span>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm new password</label>
          <div class="password-wrap">
            <input type="password" id="confirmPassword" placeholder="Re-enter your new password" autocomplete="new-password">
            <button type="button" class="toggle-pw" data-target="confirmPassword" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
          </div>
          <span class="field-error" id="confirmPasswordError"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="changeSubmit">
          <span class="btn-label">Update Password</span>
        </button>

        <p class="form-note" id="changeNote"></p>
      </form>
    </section>
  </div>
</main>

<script src="api-client.js?v=muhcihad9"></script>
<script src="auth-common.js?v=muhcihad9"></script>
<script src="ChangePassword.js?v=muhcihad9"></script>
</body>
</html>
