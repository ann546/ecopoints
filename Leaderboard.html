    <script>
      function getRegisteredLeaderboardResidents() {
        const users = (() => {
          try {
            async function loadLeaderboardFromMysql() {
  try {
    const res = await fetch('/api/leaderboard');
    const data = await res.json();
    if (!res.ok || !data.success) {
      throw new Error(data.error || 'Failed to load leaderboard');
    }
    return data.leaderboard || [];
  } catch (err) {
    console.error(err);
    return [];
  }
}

async function renderLeaderboard() {
  const list = document.getElementById('leaderboardList');
  if (!list) return;

  const entries = await loadLeaderboardFromMysql();

  if (!entries.length) {
    list.innerHTML = `<div class="scan-empty"><span>No leaderboard records yet</span></div>`;
    return;
  }

  list.innerHTML = entries.map((entry) => `
    <div class="leaderboard-row">
      <div class="lb-rank">#${entry.rank}</div>
      <div class="lb-name">
        <strong>${entry.name}</strong>
        <span>${entry.accountId || ''}</span>
      </div>
      <div class="lb-points">${Number(entry.points).toLocaleString()} pts</div>
    </div>
  `).join('');
}

renderLeaderboard();
            return value && typeof value === "object" && !Array.isArray(value)
              ? value
              : {};
          } catch {
            return {};
          }
        })();

        return Object.values(users)
          .filter((user) => user && user.role === "resident" && user.userId)
          .map((user) => ({
            name:
              `${user.fname || ""} ${user.lname || ""}`.trim() || "Resident",

            initials: `${user.fname || ""}${user.lname || ""}`
              .replace(/\s/g, "")
              .slice(0, 2)
              .toUpperCase(),

            points: Array.isArray(user.history)
              ? user.history
                  .filter((entry) => entry && Number(entry.points) > 0)
                  .reduce((sum, entry) => sum + Number(entry.points || 0), 0)
              : 0,

            userId: user.userId,
          }));
      }

      function isSameMonthDate(dateStr, referenceDate) {
        const date = new Date(dateStr);

        if (Number.isNaN(date.getTime())) {
          return false;
        }

        return (
          date.getFullYear() === referenceDate.getFullYear() &&
          date.getMonth() === referenceDate.getMonth()
        );
      }

      function earnedPointsForResident(resident, range) {
        const users = (() => {
          try {
            const value = JSON.parse(localStorage.getItem("ecoUsers"));

            return value && typeof value === "object" && !Array.isArray(value)
              ? value
              : {};
          } catch {
            return {};
          }
        })();

        const user = Object.values(users).find(
          (item) => item && item.userId === resident.userId,
        );

        if (!user || !Array.isArray(user.history)) {
          return 0;
        }

        const now = new Date();

        return user.history
          .filter((entry) => entry && Number(entry.points) > 0)
          .filter((entry) =>
            range === "month" ? isSameMonthDate(entry.date, now) : true,
          )
          .reduce((sum, entry) => sum + Number(entry.points || 0), 0);
      }

      function buildLeaderboard(range) {
        const residents = getRegisteredLeaderboardResidents();

        return residents
          .map((resident) => ({
            ...resident,
            points: earnedPointsForResident(resident, range),
            you:
              typeof getUserId === "function" &&
              String(resident.userId) === String(getUserId()),
          }))
          .filter((resident) => resident.points > 0)
          .sort((a, b) => b.points - a.points)
          .map((entry, index) => ({
            ...entry,
            rank: index + 1,
          }));
      }

      function rankClass(rank) {
        if (rank === 1) {
          return "lb-rank top1";
        }

        if (rank === 2) {
          return "lb-rank top2";
        }

        if (rank === 3) {
          return "lb-rank top3";
        }

        return "lb-rank";
      }

      function renderLeaderboard(range) {
        const data = buildLeaderboard(range);

        const list = document.getElementById("leaderboardList");

        if (!data.length) {
          list.innerHTML = `
        <div class="scan-empty">
          <i class="fa-solid fa-ranking-star"></i>
          <span>No leaderboard records yet</span>
          <p>
            Residents will appear here after
            they earn EcoPoints through actual
            verified recycling activity.
          </p>
        </div>
      `;

          return;
        }

        list.innerHTML = data
          .map(
            (entry) => `
            <div class="leaderboard-row">
              <div class="${rankClass(entry.rank)}">
                ${entry.rank}
              </div>

              <div class="lb-avatar">
                ${entry.initials}
              </div>

              <div class="lb-info">
                <span class="lb-name">
                  ${entry.name}
                  ${entry.you ? "<small>You</small>" : ""}
                </span>
              </div>

              <div class="lb-points">
                ${entry.points.toLocaleString()}
                <span>pts</span>
              </div>
            </div>
          `,
          )
          .join("");
      }

      document.querySelectorAll(".filter-btn").forEach((button) => {
        button.addEventListener("click", () => {
          document
            .querySelectorAll(".filter-btn")
            .forEach((item) => item.classList.remove("active"));

          button.classList.add("active");

          renderLeaderboard(button.dataset.range);
        });
      });

      renderLeaderboard("month");

      window.addEventListener("storage", (event) => {
        if (
          event.key === "ecoUsers" ||
          event.key === "ecoTransactions" ||
          event.key === "ecoWasteQueue"
        ) {
          const active = document.querySelector(".filter-btn.active");

          renderLeaderboard(active?.dataset.range || "month");
        }
      });
    </script>
